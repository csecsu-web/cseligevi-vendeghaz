<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foglalás - Cseligevi Vendégház</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(to bottom right, #d1fae5, #a7f3d0, #99f6e4);
            min-height: 100vh;
            padding: 1rem;
        }
        .container { max-width: 64rem; margin: 0 auto; }
        .container-sm { max-width: 28rem; margin: 0 auto; }
        .container-lg { max-width: 80rem; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            padding: 2rem;
            margin-bottom: 1.5rem;
            border: 1px solid #d1fae5;
        }
        .header { display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 2.25rem; font-weight: bold; color: #1f2937; }
        h2 { font-size: 1.875rem; font-weight: bold; color: #1f2937; margin-bottom: 2rem; }
        h3 { font-size: 1.25rem; font-weight: bold; color: #1f2937; margin-bottom: 1rem; }
        .subtitle { color: #6b7280; margin-top: 0.5rem; font-size: 1.125rem; }
        .grid { display: grid; gap: 1.5rem; }
        .grid-2 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
        .input-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.875rem; font-weight: 600; color: #374151; margin-bottom: 0.75rem; }
        input, select, textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #d1d5db;
            border-radius: 0.75rem;
            font-size: 1rem;
            transition: all 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        textarea { resize: vertical; font-family: inherit; }
        .btn {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1.125rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(to right, #059669, #10b981);
            color: white;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        .btn-primary:hover { background: linear-gradient(to right, #047857, #059669); transform: translateY(-2px); }
        .btn-secondary { background: #6b7280; color: white; }
        .btn-secondary:hover { background: #4b5563; }
        .btn-text { background: none; color: #6b7280; padding: 0.5rem; }
        .btn-text:hover { color: #1f2937; }
        .btn-icon { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 1.5rem; }
        .btn-icon:hover { color: #10b981; }
        .alert {
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: flex-start;
            border: 2px solid;
        }
        .alert-success {
            background: #d1fae5;
            border-color: #34d399;
            color: #065f46;
        }
        .alert strong { font-weight: 600; }
        .info-box {
            background: #dbeafe;
            border: 2px solid #93c5fd;
            border-radius: 1rem;
            padding: 1.5rem;
        }
        .price-box {
            background: linear-gradient(to bottom right, #d1fae5, #a7f3d0);
            border: 2px solid #6ee7b7;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .guest-box {
            background: #d1fae5;
            border: 2px solid #6ee7b7;
            border-radius: 0.75rem;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }
        .warning-box {
            background: #fef3c7;
            border: 1px solid #fbbf24;
            border-radius: 0.5rem;
            padding: 0.75rem;
            margin-top: 0.75rem;
            color: #92400e;
            font-size: 0.875rem;
        }
        .price-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
        .price-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.25rem;
            font-weight: bold;
            padding-top: 1rem;
            border-top: 2px solid #6ee7b7;
        }
        .price-total .amount { color: #059669; }
        table { width: 100%; border-collapse: collapse; }
        thead tr { background: #f9fafb; border-bottom: 2px solid #e5e7eb; }
        th { text-align: left; padding: 1rem; font-weight: 600; }
        td { padding: 1rem; border-bottom: 1px solid #f3f4f6; }
        tbody tr:hover { background: #f0fdf4; }
        .status-badge {
            display: inline-block;
            padding: 0.25rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-confirmed { background: #d1fae5; color: #065f46; }
        .status-cancelled { background: #fee2e2; color: #991b1b; }
        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: 600;
        }
        .checkbox-label input { width: 1.25rem; height: 1.25rem; margin-right: 0.75rem; }
        .divider { border-top: 2px solid #6ee7b7; padding-top: 1rem; margin-top: 1rem; }
        .text-sm { font-size: 0.875rem; color: #6b7280; margin-top: 0.25rem; }
        .text-xs { font-size: 0.75rem; color: #9ca3af; margin-top: 0.25rem; }
        .font-semibold { font-weight: 600; }
        .italic { font-style: italic; }
        .overflow-auto { overflow-x: auto; }
        .space-y-2 > * + * { margin-top: 0.5rem; }
        .ml-8 { margin-left: 2rem; }
        .mt-20 { margin-top: 5rem; }
        .text-center { text-align: center; }
        .text-emerald { color: #059669; }
        .text-gray { color: #6b7280; }
        .text-red { color: #dc2626; }
        .btn-delete {
            background: none;
            border: none;
            color: #dc2626;
            padding: 0.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-delete:hover { background: #fee2e2; }
        .empty-state { text-align: center; padding: 3rem 0; color: #9ca3af; }
        @media (max-width: 768px) {
            h1 { font-size: 1.75rem; }
            .card { padding: 1.5rem; }
            table { font-size: 0.875rem; }
            th, td { padding: 0.5rem; }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const state = {
            view: 'booking',
            isAdmin: false,
            checkIn: '',
            checkOut: '',
            hasKids: false,
            kidsNum: 1,
            name: '',
            email: '',
            phone: '',
            msg: '',
            bookings: [],
            success: false,
            prices: { 1: 45000, 2: 85000, 3: 115000 }
        };

        function init() {
            loadBookings();
            render();
        }

        function loadBookings() {
            const keys = JSON.parse(localStorage.getItem('bookingKeys') || '[]');
            state.bookings = keys.map(k => JSON.parse(localStorage.getItem(k) || 'null')).filter(Boolean);
        }

        function nights(start = state.checkIn, end = state.checkOut) {
            if (!start || !end) return 0;
            const n = Math.ceil((new Date(end) - new Date(start)) / 86400000);
            return n > 0 ? n : 0;
        }

        function total() {
            const n = nights();
            return n === 0 ? 0 : n <= 3 ? state.prices[n] : state.prices[3] + (n - 3) * 38333;
        }

        function fmt(num) {
            return new Intl.NumberFormat('hu-HU').format(num) + ' Ft';
        }

        function fmtDate(d) {
            return new Date(d).toLocaleDateString('hu-HU');
        }

        function submitBooking() {
            if (!state.checkIn || !state.checkOut || !state.name || !state.email || !state.phone) {
                alert('Kérjük, töltse ki az összes kötelező mezőt!');
                return;
            }

            const s = new Date(state.checkIn), e = new Date(state.checkOut);
            const overlap = state.bookings.some(b => {
                const bs = new Date(b.checkIn), be = new Date(b.checkOut);
                return s < be && e > bs;
            });

            if (overlap) {
                alert('Sajnáljuk, a kiválasztott időszak nem elérhető!');
                return;
            }

            const booking = {
                id: Date.now().toString(),
                checkIn: state.checkIn,
                checkOut: state.checkOut,
                hasKids: state.hasKids,
                kidsNum: state.hasKids ? state.kidsNum : 0,
                name: state.name,
                email: state.email,
                phone: state.phone,
                msg: state.msg,
                total: total(),
                status: 'pending',
                created: new Date().toISOString()
            };

            const key = `booking:${booking.id}`;
            localStorage.setItem(key, JSON.stringify(booking));
            const keys = JSON.parse(localStorage.getItem('bookingKeys') || '[]');
            keys.push(key);
            localStorage.setItem('bookingKeys', JSON.stringify(keys));

            console.log('Email to cseligevi5@gmail.com:', booking);

            state.checkIn = state.checkOut = state.name = state.email = state.phone = state.msg = '';
            state.hasKids = false;
            state.kidsNum = 1;
            state.success = true;
            loadBookings();
            render();
            setTimeout(() => { state.success = false; render(); }, 8000);
        }

        function updateStatus(id, status) {
            const b = state.bookings.find(x => x.id === id);
            if (b) {
                b.status = status;
                localStorage.setItem(`booking:${id}`, JSON.stringify(b));
                loadBookings();
                render();
            }
        }

        function deleteBooking(id) {
            if (!confirm('Biztosan törli ezt a foglalást?')) return;
            localStorage.removeItem(`booking:${id}`);
            const keys = JSON.parse(localStorage.getItem('bookingKeys') || '[]');
            localStorage.setItem('bookingKeys', JSON.stringify(keys.filter(k => k !== `booking:${id}`)));
            loadBookings();
            render();
        }

        function render() {
            const app = document.getElementById('app');
            
            if (state.view === 'admin' && !state.isAdmin) {
                app.innerHTML = `
                    <div class="container-sm mt-20">
                        <div class="card">
                            <h2 class="text-center">Admin Bejelentkezés</h2>
                            <div class="input-group">
                                <input type="password" id="adminPwd" placeholder="Jelszó" />
                            </div>
                            <button onclick="login()" class="btn btn-primary">Bejelentkezés</button>
                            <button onclick="state.view='booking'; render();" class="btn btn-text" style="margin-top: 0.75rem;">
                                Vissza a foglaláshoz
                            </button>
                        </div>
                    </div>
                `;
            } else if (state.view === 'admin') {
                app.innerHTML = `
                    <div class="container-lg">
                        <div class="card">
                            <div class="header">
                                <div>
                                    <h1>Admin Panel</h1>
                                    <div class="subtitle">Cseligevi Vendégház</div>
                                </div>
                                <button onclick="state.view='booking'; state.isAdmin=false; render();" class="btn btn-secondary" style="width: auto; padding: 0.5rem 1.5rem;">
                                    Kilépés
                                </button>
                            </div>
                        </div>
                        <div class="card">
                            <h2>Foglalások (${state.bookings.length})</h2>
                            <div class="overflow-auto">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Név</th>
                                            <th>Időszak</th>
                                            <th>Vendégek</th>
                                            <th>Kapcsolat</th>
                                            <th>Összeg</th>
                                            <th>Státusz</th>
                                            <th>Műveletek</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${state.bookings.length === 0 ? 
                                            '<tr><td colspan="7" class="empty-state">Még nincsenek foglalások</td></tr>' :
                                            state.bookings.sort((a,b) => new Date(b.created) - new Date(a.created)).map(b => `
                                            <tr>
                                                <td>
                                                    <div class="font-semibold">${b.name}</div>
                                                    ${b.msg ? `<div class="text-sm italic">${b.msg}</div>` : ''}
                                                </td>
                                                <td>
                                                    <div class="font-semibold">${fmtDate(b.checkIn)} - ${fmtDate(b.checkOut)}</div>
                                                    <div class="text-xs">${nights(b.checkIn, b.checkOut)} éjszaka</div>
                                                </td>
                                                <td>
                                                    <div>2 felnőtt</div>
                                                    ${b.hasKids ? `<div class="text-emerald">${b.kidsNum} gyerek</div>` : ''}
                                                </td>
                                                <td>
                                                    <div class="text-sm">${b.email}</div>
                                                    <div class="text-sm">${b.phone}</div>
                                                </td>
                                                <td><strong class="text-emerald">${fmt(b.total)}</strong></td>
                                                <td>
                                                    <select onchange="updateStatus('${b.id}', this.value)" 
                                                        class="status-badge status-${b.status}" style="border: none; cursor: pointer;">
                                                        <option value="pending" ${b.status === 'pending' ? 'selected' : ''}>Függőben</option>
                                                        <option value="confirmed" ${b.status === 'confirmed' ? 'selected' : ''}>Megerősítve</option>
                                                        <option value="cancelled" ${b.status === 'cancelled' ? 'selected' : ''}>Lemondva</option>
                                                    </select>
                                                </td>
                                                <td>
                                                    <button onclick="deleteBooking('${b.id}')" class="btn-delete">✕</button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                const n = nights();
                const t = total();
                app.innerHTML = `
                    <div class="container">
                        <div class="card">
                            <div class="header">
                                <div>
                                    <h1>Cseligevi Vendégház</h1>
                                    <div class="subtitle">A természet ritmusában</div>
                                </div>
                                <button onclick="state.view='admin'; render();" class="btn-icon">⚙️</button>
                            </div>
                        </div>

                        ${state.success ? `
                        <div class="alert alert-success">
                            <div>
                                <div><strong>✓ Foglalása sikeresen elküldve!</strong></div>
                                <div style="font-size: 0.875rem; margin-top: 0.25rem;">
                                    Hamarosan felvesszük Önnel a kapcsolatot a <strong>cseligevi5@gmail.com</strong> címről.
                                </div>
                            </div>
                        </div>
                        ` : ''}

                        <div class="card">
                            <h2>Foglalás</h2>
                            
                            <div class="grid grid-2">
                                <div class="input-group">
                                    <label>📅 Érkezés</label>
                                    <input type="date" value="${state.checkIn}" 
                                        min="${new Date().toISOString().split('T')[0]}"
                                        onchange="state.checkIn=this.value; render();" />
                                </div>
                                <div class="input-group">
                                    <label>📅 Távozás</label>
                                    <input type="date" value="${state.checkOut}"
                                        min="${state.checkIn || new Date().toISOString().split('T')[0]}"
                                        onchange="state.checkOut=this.value; render();" />
                                </div>
                            </div>

                            <div class="guest-box">
                                <div style="margin-bottom: 1rem;">
                                    <div class="font-semibold">👤 Felnőttek: 2 fő (standard)</div>
                                    <div class="text-sm">A vendégház 2 felnőtt részére biztosít szállást</div>
                                </div>
                                <div class="divider">
                                    <label class="checkbox-label">
                                        <input type="checkbox" ${state.hasKids ? 'checked' : ''}
                                            onchange="state.hasKids=this.checked; render();" />
                                        <span>👶 Gyerekekkel érkezünk (max. 2 gyerek)</span>
                                    </label>
                                    ${state.hasKids ? `
                                    <div class="ml-8" style="margin-top: 1rem;">
                                        <label style="font-size: 0.875rem;">Gyerekek száma</label>
                                        <select onchange="state.kidsNum=parseInt(this.value); render();" style="margin-top: 0.5rem;">
                                            <option value="1" ${state.kidsNum === 1 ? 'selected' : ''}>1 gyerek</option>
                                            <option value="2" ${state.kidsNum === 2 ? 'selected' : ''}>2 gyerek</option>
                                        </select>
                                        <div class="warning-box">
                                            <strong>Fontos:</strong> Gyerekekkel való érkezés esetén kérjük, vegye fel velünk a kapcsolatot emailben!
                                        </div>
                                    </div>
                                    ` : ''}
                                </div>
                            </div>

                            ${n > 0 ? `
                            <div class="price-box">
                                <h3>Ár kalkuláció</h3>
                                <div style="margin-bottom: 1rem;">
                                    ${n <= 3 ? `
                                    <div class="price-row">
                                        <span>${n} éjszaka</span>
                                        <span class="font-semibold">${fmt(state.prices[n])}</span>
                                    </div>
                                    ` : `
                                    <div class="space-y-2">
                                        <div class="price-row">
                                            <span>Első 3 éjszaka</span>
                                            <span class="font-semibold">${fmt(state.prices[3])}</span>
                                        </div>
                                        <div class="price-row">
                                            <span>${n - 3} további éjszaka</span>
                                            <span class="font-semibold">${fmt((n - 3) * 38333)}</span>
                                        </div>
                                    </div>
                                    `}
                                </div>
                                <div class="price-total">
                                    <span>Összesen</span>
                                    <span class="amount">${fmt(t)}</span>
                                </div>
                            </div>
                            ` : ''}

                            <div class="grid grid-2">
                                <div class="input-group">
                                    <label>Név *</label>
                                    <input type="text" value="${state.name}" placeholder="Teljes név"
                                        onchange="state.name=this.value" />
                                </div>
                                <div class="input-group">
                                    <label>Email *</label>
                                    <input type="email" value="${state.email}" placeholder="pelda@email.com"
                                        onchange="state.email=this.value" />
                                </div>
                            </div>

                            <div class="input-group">
                                <label>Telefonszám *</label>
                                <input type="tel" value="${state.phone}" placeholder="+36 30 123 4567"
                                    onchange="state.phone=this.value" />
                            </div>

                            <div class="input-group">
                                <label>Üzenet (opcionális)</label>
                                <textarea rows="4" placeholder="Különleges kérések..."
                                    onchange="state.msg=this.value">${state.msg}</textarea>
                            </div>

                            <button onclick="submitBooking()" class="btn btn-primary">
                                Foglalás elküldése
                            </button>
                        </div>

                        <div class="info-box">
                            <h3>Fontos információk</h3>
                            <ul class="space-y-2" style="font-size: 0.875rem; margin-left: 1.25rem;">
                                <li>A foglalás után emailben kapja meg a megerősítést a <strong>cseligevi5@gmail.com</strong> címről</li>
                                <li>Gyerekekkel való érkezés esetén mindenképpen vegye fel velünk a kapcsolatot!</li>
                                <li>Fizetési információkat a visszaigazoló emailben küldjük meg</li>
                            </ul>
                        </div>
                    </div>
                `;
            }
        }

        function login() {
            const pwd = document.getElementById('adminPwd').value;
            if (pwd === 'cseligevi2025') {
                state.isAdmin = true;
                render();
            } else {
                alert('Helytelen jelszó!');
            }
        }

        window.onload = init;
    </script>
</body>
</html>
