<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cseligevi Vendégház – természet és nyugalom | Szekszárd</title>

<meta property="og:type" content="website">
<meta property="og:title" content="Cseligevi Vendégház – természet és nyugalom | Szekszárd">
<meta property="og:description" content="Vendégház a természet ritmusában. Valódi pihenés, benti szauna, családbarát környezet.">
<meta property="og:image" content="favicon.png">
<meta property="og:url" content="https://cseligevivendeghaz.com/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Cseligevi Vendégház – természet és nyugalom">
<meta name="twitter:description" content="Valódi pihenés a Szekszárdi borvidéken.">
<meta name="twitter:image" content="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="canonical" href="https://cseligevivendeghaz.com/">
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="navbar-container"></div>

<section class="hero">
  <div data-include="hero-background.html"></div> 

  <div class="hero-overlay glass">
    <div class="brand-svg">
      <svg viewBox="0 0 200 60">
        <path id="brand-path" d="M10,30 C40,5 80,55 110,25 C130,10 160,20 190,30" fill="transparent" stroke="var(--color-accent)" stroke-width="2"/>
      </svg>
    </div>
    <h1 class="clip">Cseligevi – A természet ritmusában</h1>
    <p class="clip">A nyugalom otthona</p>
    <a class="btn clip" href="foglalas.html">Foglalj most</a>
  </div>

  <div class="scroll-indicator" onclick="document.querySelector('.container').scrollIntoView({behavior: 'smooth'})">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
    </svg>
  </div>
</section>

<section class="container values clip">
  <div class="value-card">
    <h3>Természet közelsége</h3>
    <p>Dombok, szőlősorok és csend – minden pillanat különleges.</p>
  </div>
  <div class="value-card">
    <h3>Benti szauna</h3>
    <p>A hűvösebb napokon is feltöltődés és kényelem.</p>
  </div>
  <div class="value-card">
    <h3>Családbarát</h3>
    <p>Tágas zöld udvar játékhoz és közös élményekhez.</p>
  </div>
</section>

<section class="container clip">
  <h2>Hangulatképek</h2>
  <div class="strip" aria-label="Képszalag">
    <img class="tile" src="images/nappali.webp" alt="Nappali" loading="lazy">
    <img class="tile" src="images/konyha.webp" alt="Konyha" loading="lazy">
    <img class="tile" src="images/haloszoba.webp" alt="Hálószoba" loading="lazy">
    <img class="tile" src="images/terasz.webp" alt="Terasz" loading="lazy">
    <img class="tile" src="images/kert.webp" alt="Kert" loading="lazy">
    <img class="tile" src="images/panorama.webp" alt="Panoráma" loading="lazy">
    <img class="tile" src="images/szauna.webp" alt="Szauna" loading="lazy">
  </div>
</section>

<div id="footer-container" data-include="footer.html"></div> 

<script src="include.js"></script>
<script src="animation.js"></script>
<script src="nav.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const indicator = document.querySelector('.scroll-indicator');
    if (indicator) {
      indicator.addEventListener('click', () => {
        const target = document.querySelector('.container');
        if (target) target.scrollIntoView({ behavior: 'smooth' });
      });
    }
  });
</script>

</body>
</html>
