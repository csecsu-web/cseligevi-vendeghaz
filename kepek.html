<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cseligevi Vendégház képgaléria - Fedezd fel vendégházunk minden szegletét képekben.">
    <title>Képgaléria - Cseligevi Vendégház</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery-hero {
            text-align: center;
            padding: 4rem 1rem 2rem;
            background: linear-gradient(135deg, rgba(5, 150, 105, 0.05), rgba(16, 185, 129, 0.05));
        }
        
        .gallery-hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #059669;
        }
        
        .gallery-hero p {
            font-size: 1.25rem;
            color: #6b7280;
        }
        
        .gallery-categories {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 2rem 0;
            padding: 0 1rem;
        }
        
        .category-btn {
            padding: 0.75rem 1.5rem;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 50px;
            color: #6b7280;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .category-btn:hover,
        .category-btn.active {
            background: #059669;
            color: white;
            border-color: #059669;
        }
        
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            padding: 2rem 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            aspect-ratio: 4/3;
        }
        
        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }
        
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        
        .gallery-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            color: white;
            padding: 2rem 1.5rem 1rem;
            font-weight: 600;
            font-size: 1.125rem;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .gallery-item:hover .gallery-caption {
            opacity: 1;
        }
        
        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .lightbox.active {
            display: flex;
        }
        
        .lightbox img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        
        .lightbox-close {
            position: absolute;
            top: 2rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.5rem;
            color: #1f2937;
            transition: transform 0.3s;
            font-weight: bold;
        }
        
        .lightbox-close:hover {
            transform: rotate(90deg);
        }
        
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #1f2937;
            font-size: 1.5rem;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .lightbox-nav:hover {
            background: #059669;
            color: white;
        }
        
        .lightbox-prev {
            left: 2rem;
        }
        
        .lightbox-next {
            right: 2rem;
        }
        
        .image-counter {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            color: #1f2937;
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
            
            .gallery-hero h1 {
                font-size: 2rem;
            }
            
            .lightbox-nav {
                width: 40px;
                height: 40px;
            }
            
            .lightbox-prev {
                left: 1rem;
            }
            
            .lightbox-next {
                right: 1rem;
            }
        }
    </style>
</head>
<body>
    <div include-html="navbar.html"></div>

    <main>
        <div class="gallery-hero">
            <h1>Képgaléria</h1>
            <p>Fedezd fel a Cseligevi Vendégházat</p>
        </div>

        <div class="gallery-categories">
            <button class="category-btn active" onclick="filterGallery('all')">Összes</button>
            <button class="category-btn" onclick="filterGallery('interior')">Beltér</button>
            <button class="category-btn" onclick="filterGallery('exterior')">Kültér</button>
            <button class="category-btn" onclick="filterGallery('panorama')">Panoráma</button>
        </div>

        <div class="gallery-grid" id="galleryGrid">
            <!-- Interior -->
            <div class="gallery-item" data-category="interior" onclick="openLightbox(0)">
                <img src="images/nappali1.jpg" alt="Tágas nappali" loading="lazy">
                <div class="gallery-caption">Nappali</div>
            </div>

            <div class="gallery-item" data-category="interior" onclick="openLightbox(1)">
                <img src="images/konyha1.jpg" alt="Modern konyha" loading="lazy">
                <div class="gallery-caption">Konyha</div>
            </div>

            <div class="gallery-item" data-category="interior" onclick="openLightbox(2)">
                <img src="images/halo1.jpg" alt="Otthonos hálószoba" loading="lazy">
                <div class="gallery-caption">Hálószoba</div>
            </div>

            <div class="gallery-item" data-category="interior" onclick="openLightbox(3)">
                <img src="images/szauna1.jpg" alt="Modern benti szauna" loading="lazy">
                <div class="gallery-caption">Szauna</div>
            </div>

            <!-- Exterior -->
            <div class="gallery-item" data-category="exterior" onclick="openLightbox(4)">
                <img src="images/terasz1.jpg" alt="Fedett terasz" loading="lazy">
                <div class="gallery-caption">Terasz</div>
            </div>

            <div class="gallery-item" data-category="exterior" onclick="openLightbox(5)">
                <img src="images/kert1.jpg" alt="Zöld kert" loading="lazy">
                <div class="gallery-caption">Kert</div>
            </div>

            <div class="gallery-item" data-category="exterior" onclick="openLightbox(6)">
                <img src="images/kulteri.jpg" alt="Tágas zöld udvar" loading="lazy">
                <div class="gallery-caption">Kültéri rész</div>
            </div>

            <!-- Panorama -->
            <div class="gallery-item" data-category="panorama" onclick="openLightbox(7)">
                <img src="images/panorama1.jpg" alt="Panoráma kilátás" loading="lazy">
                <div class="gallery-caption">Panoráma</div>
            </div>
        </div>

        <div style="text-align: center; padding: 3rem 1rem;">
            <h2 style="font-size: 2rem; margin-bottom: 1rem;">Tetszik, amit látsz?</h2>
            <p style="font-size: 1.125rem; color: #6b7280; margin-bottom: 2rem;">Foglald le időpontodat és tapasztald meg személyesen!</p>
            <a href="foglalas.html" class="cta-button" style="font-size: 1.125rem; padding: 1rem 2.5rem;">Foglalás indítása</a>
        </div>
    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <div class="lightbox-close" onclick="closeLightbox()">×</div>
        <div class="lightbox-nav lightbox-prev" onclick="navigateLightbox(-1); event.stopPropagation();">‹</div>
        <img id="lightboxImage" src="" alt="">
        <div class="lightbox-nav lightbox-next" onclick="navigateLightbox(1); event.stopPropagation();">›</div>
        <div class="image-counter" id="imageCounter">1 / 8</div>
    </div>

    <div include-html="footer.html"></div>

    <script src="include.js"></script>
    <script>
        // Gallery images
        const galleryImages = [
            { src: 'images/nappali1.jpg', title: 'Nappali' },
            { src: 'images/konyha1.jpg', title: 'Konyha' },
            { src: 'images/halo1.jpg', title: 'Hálószoba' },
            { src: 'images/szauna1.jpg', title: 'Szauna' },
            { src: 'images/terasz1.jpg', title: 'Terasz' },
            { src: 'images/kert1.jpg', title: 'Kert' },
            { src: 'images/kulteri.jpg', title: 'Kültéri rész' },
            { src: 'images/panorama1.jpg', title: 'Panoráma' }
        ];

        let currentImageIndex = 0;

        // Filter gallery by category
        function filterGallery(category) {
            const items = document.querySelectorAll('.gallery-item');
            const buttons = document.querySelectorAll('.category-btn');
            
            // Update active button
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Filter items
            items.forEach(item => {
                if (category === 'all' || item.dataset.category === category) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // Lightbox functions
        function openLightbox(index) {
            currentImageIndex = index;
            updateLightboxImage();
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox(event) {
            if (!event || event.target.id === 'lightbox' || event.target.classList.contains('lightbox-close')) {
                document.getElementById('lightbox').classList.remove('active');
                document.body.style.overflow = 'auto';
            }
        }

        function navigateLightbox(direction) {
            currentImageIndex += direction;
            if (currentImageIndex < 0) currentImageIndex = galleryImages.length - 1;
            if (currentImageIndex >= galleryImages.length) currentImageIndex = 0;
            updateLightboxImage();
        }

        function updateLightboxImage() {
            const img = document.getElementById('lightboxImage');
            const counter = document.getElementById('imageCounter');
            img.src = galleryImages[currentImageIndex].src;
            img.alt = galleryImages[currentImageIndex].title;
            counter.textContent = `${currentImageIndex + 1} / ${galleryImages.length}`;
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (document.getElementById('lightbox').classList.contains('active')) {
                if (e.key === 'ArrowLeft') navigateLightbox(-1);
                if (e.key === 'ArrowRight') navigateLightbox(1);
                if (e.key === 'Escape') closeLightbox();
            }
        });
    </script>
</body>
</html>
