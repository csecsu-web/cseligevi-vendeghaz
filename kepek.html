<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Képek – Cseligevi Vendégház</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="canonical" href="https://cseligevivendeghaz.com/kepek.html">
  <meta name="description" content="Képek – válogatás a Cseligevi Vendégház belső tereiből, kültéri élményekből és a benti szaunából.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
</head>
<body>
  
<div id="navbar-container"></div>

<section class="hero">
  <div data-include="hero-background.html"></div> 
  <div class="hero-overlay glass">
    <h1 class="clip">Képek</h1>
    <p class="clip">Válogatás a vendégházból és a környékről</p>
    <a class="btn clip" href="foglalas.html">Foglalj most</a>
  </div>
</section>

<main class="container">
  <section class="values clip">
    <div class="value-card"><h3>Belső terek</h3><p>Nappali, konyha, hálószobák</p></div>
    <div class="value-card"><h3>Kültéri élmények</h3><p>Terasz, kert, panoráma</p></div>
    <div class="value-card"><h3>Wellness</h3><p>Benti szauna és pihenés</p></div>
  </section>

  <section class="clip">
    <h2 style="text-align: center; margin-bottom: 30px;">Galéria</h2>
    <div id="gallery-wrapper" style="position: relative; width: 100%; height: 60vh; min-height: 400px; background: #000; border-radius: 12px; overflow: hidden;">
        <div id="gallery-container" style="width: 100%; height: 100%; cursor: grab;"></div>
    </div>
    <p style="text-align: center; margin-top: 15px; opacity: 0.7; font-size: 0.9rem;">
        <span class="desktop-hint">Húzd az egeret a lapozáshoz</span>
        <span class="mobile-hint" style="display:none;">Húzd az ujjad a lapozáshoz</span>
    </p>
  </section>
</main>

<div id="footer-container" data-include="footer.html"></div>

<script src="include.js"></script>
<script src="nav.js"></script>

<!-- Import Map for OGL -->
<script type="importmap">
{
    "imports": {
        "ogl": "https://esm.sh/ogl"
    }
}
</script>

<!-- Initialize Circular Gallery -->
<script type="module">
    import CircularGallery from './CircularGallery.js';

    // Image list
    const items = [
        { image: 'images/nappali1.jpg', text: 'Nappali' },
        { image: 'images/alsoszint2.webp', text: 'Alsószint' },
        { image: 'images/konyha1.jpg', text: 'Konyha' },
        { image: 'images/alsoszint.webp', text: 'Alsószint' },
        { image: 'images/halo1.jpg', text: 'Hálószoba' },
        { image: 'images/emelet.webp', text: 'Emelet' },
        { image: 'images/terasz1.jpg', text: 'Terasz' },
        { image: 'images/kert1.jpg', text: 'Kert' },
        { image: 'images/panorama1.jpg', text: 'Panoráma' },
        { image: 'images/szauna1.jpg', text: 'Szauna' },
        { image: 'images/zuhanyzo.webp', text: 'Zuhanyzó' },
        { image: 'images/furdo1.webp', text: 'Fürdő' },
        { image: 'images/szauna2.webp', text: 'Szauna' },
        { image: 'images/kulteri1.webp', text: 'Kültéri' },
        { image: 'images/külteri2.webp', text: 'Kültéri' },
        { image: 'images/kint.webp', text: 'Természet' },
        { image: 'images/rolunk2.jpg', text: 'Borvidék' },
        { image: 'images/rolunk3.jpg', text: 'Pihenés' },
        { image: 'images/rolunk4.jpg', text: 'Nyugalom' }
    ];

    // Initialize
    const container = document.getElementById('gallery-container');
    
    // Check if container exists
    if (container) {
        new CircularGallery({
            container: container,
            items: items,
            bend: 4,
            textColor: '#ffffff',
            borderRadius: 0.05
        });
    }

    // Mobile hint detection
    if ('ontouchstart' in window) {
        document.querySelector('.mobile-hint').style.display = 'inline';
        document.querySelector('.desktop-hint').style.display = 'none';
    }
</script>

<script>
    // Animation triggers
    gsap.registerPlugin(ScrollTrigger);

    gsap.utils.toArray('.clip').forEach(element => {
        gsap.fromTo(element, 
            { clipPath: 'inset(0 100% 0 0)' },
            { 
                clipPath: 'inset(0 0 0 0)', 
                duration: 1, 
                ease: 'power4.out',
                scrollTrigger: {
                    trigger: element,
                    start: 'top 80%',
                    toggleActions: 'play none none none'
                }
            }
        );
    });
</script>

</body>
</html>
