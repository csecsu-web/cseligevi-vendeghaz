<body>
  
<div id="navbar-container"></div>

<section class="hero">
  <div data-include="hero-background.html"></div> 
  <div class="hero-overlay glass">
    <h1 class="clip">Képek</h1>
    <p class="clip">Válogatás a vendégházból</p>
    <a class="btn clip" href="foglalas.html">Foglalj most</a>
  </div>
</section>

<main class="container">
  <section class="values clip">
    <div class="value-card"><h3>Belső terek</h3><p>Nappali, konyha, hálószobák</p></div>
    <div class="value-card"><h3>Kültéri élmények</h3><p>Terasz, kert, panoráma</p></div>
    <div class="value-card"><h3>Wellness</h3><p>Benti szauna</p></div>
  </section>

  <section class="circular-gallery-container" style="height:600px; position:relative;">
    <div id="circular-gallery"></div>
  </section>
</main>

<div id="footer-container" data-include="footer.html"></div>

<script type="module">
  import CircularGallery from './CircularGallery.js';
  const galleryContainer = document.getElementById('circular-gallery');
  new CircularGallery({
    container: galleryContainer,
    bend: 3,
    textColor: '#ffffff',
    borderRadius: 0.05,
    scrollEase: 0.02
  });
</script>

<script src="include.js"></script>
<script src="animation.js"></script>
<script src="nav.js"></script>
